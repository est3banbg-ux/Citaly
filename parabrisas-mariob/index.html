/* portada */
.pr-hero{padding:56px 0 30px;text-align:center}
.pr-status{display:inline-flex;align-items:center;gap:9px;font-size:14px;font-weight:600;color:var(--mute);padding:7px 14px;border-radius:999px;background:var(--cardt);box-shadow:inset 0 0 0 1px var(--hair);text-align:left}
.pr-dot{width:8px;height:8px;border-radius:50%;background:#8a9a9b;flex:none}
.pr-status.on{color:var(--ink)}.pr-status.on .pr-dot{background:var(--wa);box-shadow:0 0 0 4px rgba(37,211,102,.2)}
.pr-hero h1{font-size:clamp(40px,9.5vw,88px);font-weight:800;line-height:1;letter-spacing:-.045em;margin:24px auto 22px;max-width:14ch}
.pr-hero h1 .dim{font-size:.62em;letter-spacing:-.035em;line-height:1.1;margin-bottom:.12em}
.pr-hero h1 .hl.hl-lg{font-size:.8em}
.pr-hero .pr-sub{margin-top:0}
.pr-trust{display:inline-flex;align-items:center;gap:12px;margin:22px auto 0;padding:8px 16px 8px 10px;border-radius:999px;text-decoration:none;background:var(--cardt);box-shadow:inset 0 0 0 1px var(--hair);text-align:left;max-width:100%}
.pr-av{display:flex;flex:none}
.pr-av img{width:34px;height:34px;border-radius:50%;object-fit:cover;box-shadow:0 0 0 2px var(--bg);margin-left:-10px}
.pr-av img:first-child{margin-left:0}
.pr-trust>span:last-child{min-width:0}
.pr-trust b{display:block;font:700 14px Figtree,system-ui,sans-serif;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pr-trust small{display:block;font-size:12.5px;color:var(--hi)}
.pr-promo{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:14px;max-width:600px;margin:26px auto 0;padding:16px 18px;border-radius:20px;text-decoration:none;text-align:left;color:#1b1300;background:linear-gradient(135deg,#ffe08a,#f5b52e 60%,#f0a614);box-shadow:0 18px 40px -18px rgba(0,0,0,.7),inset 0 1px 0 rgba(255,255,255,.5);position:relative;overflow:hidden;transition:transform 200ms var(--ease)}
.pr-promo::after{content:"";position:absolute;top:0;bottom:0;left:0;width:30%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.55),transparent);transform:translateX(-160%) skewX(-18deg);animation:prshine 4.5s ease-in-out 1.5s infinite;will-change:transform}
@keyframes prshine{0%{transform:translateX(-160%) skewX(-18deg)}35%,100%{transform:translateX(460%) skewX(-18deg)}}
.pr-gift{display:grid;place-items:center;width:48px;height:48px;border-radius:14px;background:rgba(27,19,0,.12)}
.pr-gift svg{width:28px;height:28px}
.pr-promo b{display:block;font:800 17px/1.25 "Bricolage Grotesque",sans-serif;letter-spacing:-.01em}
.pr-promo small{display:block;font-size:13.5px;opacity:.8;margin-top:4px}
.pr-promo .go{width:24px;height:24px;transition:transform 200ms var(--ease)}
@media (hover:hover) and (pointer:fine){.pr-promo:hover{transform:translateY(-2px)}.pr-promo:hover .go{transform:translateX(3px)}}
.pr-ctas{display:flex;flex-wrap:wrap;justify-content:center;gap:12px;margin-top:30px}
.pr-note{margin-top:14px;color:var(--mute);font-size:14.5px;text-align:center;text-wrap:balance}
.pr-note svg{display:inline-block;width:18px;height:18px;color:var(--wa);vertical-align:-4px;margin-right:6px}
.pr-frame{margin:44px auto 0;max-width:920px;padding:10px;border-radius:30px;background:linear-gradient(180deg,color-mix(in srgb,var(--hi) 24%,transparent),color-mix(in srgb,var(--hi) 4%,transparent) 60%);box-shadow:0 40px 90px -40px rgba(0,0,0,.7)}
.pr-shot{position:relative;aspect-ratio:4/3;border-radius:22px;overflow:hidden;background:var(--card)}
@media(min-width:700px){.pr-shot{aspect-ratio:16/9}}
.pr-shot>img{width:100%;height:100%;object-fit:cover}
.pr-biglogo{display:grid;place-items:center}.pr-biglogo>img{width:auto;height:70%;object-fit:contain}
.pr-hcap{position:absolute;left:12px;bottom:12px;background:rgba(0,0,0,.6);color:#fff;border-radius:999px;padding:5px 13px;font-size:13.5px;font-weight:600}
/* chips */
.pr-marq{padding:46px 0 14px;overflow:hidden}
.pr-marq>p{text-align:center;color:var(--mute);font-weight:600;margin-bottom:20px;padding:0 20px}
.pr-mask{-webkit-mask-image:linear-gradient(90deg,transparent,#000 12%,#000 88%,transparent);mask-image:linear-gradient(90deg,transparent,#000 12%,#000 88%,transparent)}
.pr-track{display:flex;gap:12px;width:max-content;animation:prmq 34s linear infinite}
.pr-track span{display:inline-flex;align-items:center;gap:10px;padding:12px 18px;border-radius:999px;background:var(--cardt);box-shadow:inset 0 0 0 1px var(--hair);font-weight:700;white-space:nowrap}
.pr-track svg,.pr-track .ics{width:20px;height:20px;color:var(--hi);flex:none}
.pr-track .ico-img{object-fit:contain}
@keyframes prmq{to{transform:translateX(-50%)}}
@media (prefers-reduced-motion:reduce){.pr-track{animation:none;width:auto;flex-wrap:wrap;justify-content:center;padding:0 20px}.pr-track span[aria-hidden]{display:none}.pr-mask{-webkit-mask-image:none;mask-image:none}.pr-promo::after{animation:none}}
/* datos rápidos */
.pr-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;max-width:920px;margin:22px auto 0}
.pr-stat{padding:20px 10px;border-radius:20px;text-align:center;background:var(--cardt);box-shadow:inset 0 0 0 1px var(--hair),var(--sh)}
.pr-stat strong{display:block;font:800 clamp(26px,6vw,44px)/1.05 "Bricolage Grotesque",sans-serif;letter-spacing:-.04em;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.pr-stat:nth-child(1) strong{color:var(--hi)}.pr-stat:nth-child(2) strong{color:var(--wa)}
html[data-pm=light] .pr-stat:nth-child(2) strong{color:#1a9e4d}
.pr-stat>span{display:block;margin-top:8px;font-weight:600;font-size:clamp(13px,2.6vw,16px);line-height:1.3}
/* trabajos */
.pr .tabs{display:flex;width:fit-content;max-width:100%;margin:26px auto 22px;background:var(--cardt);border-color:var(--hair)}
.pr .tabs button[aria-selected="true"]{background:var(--cta);color:var(--ctaink)}
.pr-cars{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:26px auto 0}
.pr-cars.c1{grid-template-columns:minmax(0,420px);justify-content:center}
@media(min-width:860px){.pr-cars{grid-template-columns:repeat(4,1fr);gap:14px}.pr-cars.c1{grid-template-columns:minmax(0,420px)}.pr-cars.c2{grid-template-columns:repeat(2,1fr);max-width:640px}.pr-cars.c3{grid-template-columns:repeat(3,1fr)}}
.pr-car.more{display:none}.pr-cars.all .pr-car.more{display:block}
.pr-car{position:relative;display:block;width:100%;padding:0;border:0;border-radius:22px;overflow:hidden;aspect-ratio:4/5;cursor:zoom-in;background:var(--card);box-shadow:0 0 0 1px var(--hair),var(--sh);color:#fff}
.pr-car img{width:100%;height:100%;object-fit:cover}
.pr-cc{position:absolute;left:0;right:0;bottom:0;padding:44px 14px 14px;text-align:left;background:linear-gradient(180deg,transparent,rgba(4,19,26,.92))}
.pr-cc b{display:block;font:800 18px/1.15 "Bricolage Grotesque",sans-serif;letter-spacing:-.01em}
@media (hover:hover) and (pointer:fine){.pr-car img{transition:transform 600ms var(--ease)}.pr-car:hover img{transform:scale(1.04)}}
.pr .vids{margin-top:6px}
.pr .vf{border-radius:22px;box-shadow:0 0 0 1px var(--hair)}
.pr .vid figcaption{color:var(--mute)}
/* antes y después (la foto trae el antes arriba y el después abajo) */
.pr-baw{max-width:760px;margin:26px auto 0}
.pr-baw+.pr-baw{margin-top:34px}
.pr-ba{position:relative;aspect-ratio:2/1;border-radius:22px;overflow:hidden;user-select:none;-webkit-user-select:none;touch-action:pan-y;background:var(--card);box-shadow:0 0 0 1px var(--hair)}
.pr-frame .pr-ba{border-radius:22px}
.pr-lay{position:absolute;inset:0;background-repeat:no-repeat;background-size:100% 200%}
.pr-after{clip-path:inset(0 0 0 var(--pos,50%))}
.pr-bar{position:absolute;top:0;bottom:0;left:var(--pos,50%);width:2px;margin-left:-1px;background:#fff;pointer-events:none}
.pr-knob{position:absolute;top:50%;left:var(--pos,50%);width:48px;height:48px;margin:-24px 0 0 -24px;border-radius:50%;background:#fff;color:#04131a;display:grid;place-items:center;box-shadow:0 8px 24px rgba(0,0,0,.5);pointer-events:none}
.pr-knob svg{width:22px;height:22px}
.pr .pr-ba input{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:ew-resize;margin:0;padding:0;border:0;border-radius:0}
.pr-ba input:focus-visible~.pr-knob{outline:3px solid var(--hi);outline-offset:3px}
.pr-tag{position:absolute;top:12px;padding:6px 12px;border-radius:10px;font:700 12px Figtree,sans-serif;letter-spacing:.08em;text-transform:uppercase;pointer-events:none}
.pr-tag.l{left:12px;background:rgba(4,19,26,.75);color:#fff}
.pr-tag.r{right:12px;background:var(--cta);color:var(--ctaink)}
.pr-bacap{display:flex;justify-content:center;align-items:center;gap:8px;margin-top:12px;color:var(--mute);font-size:14px;text-align:center}
.pr-bacap svg{width:16px;height:16px;color:var(--hi);flex:none}
.pr-sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
/* precios */
.pr-gh{margin:40px 0 -14px;font-size:clamp(22px,4vw,30px);letter-spacing:-.03em}
.pr-plans{display:grid;grid-template-columns:minmax(0,1fr);gap:14px;margin-top:34px}
.pr-gh+.pr-plans{margin-top:30px}
@media(min-width:700px){.pr-plans.c2{grid-template-columns:repeat(2,minmax(0,1fr));max-width:820px;margin-inline:auto}.pr-plans.c1{max-width:420px;margin-inline:auto}}
@media(min-width:960px){.pr-plans.c3{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media(min-width:700px) and (max-width:959px){.pr-plans.c3{grid-template-columns:repeat(2,minmax(0,1fr))}}
.pr-plans.c1{max-width:420px;margin-inline:auto}
.pr-plan{display:flex;flex-direction:column;min-width:0;border-radius:26px;padding:26px;background:var(--cardt);box-shadow:inset 0 0 0 1px var(--hair),var(--sh)}
.pr-plan.best{background:linear-gradient(180deg,color-mix(in srgb,var(--hi) 14%,var(--card)),var(--card) 48%);box-shadow:inset 0 0 0 2px var(--hi),var(--sh)}
.pr-lbl{font-size:13px;font-weight:700;color:var(--hi);margin-bottom:8px;min-height:18px}
.pr-ph{display:flex;align-items:center;gap:12px}
.pr-ph h3{min-width:0;overflow-wrap:anywhere}
.pr-pic{width:46px;height:46px;border-radius:14px;flex:none;display:grid;place-items:center;font-size:24px;background:color-mix(in srgb,var(--hi) 12%,transparent);color:var(--hi)}
.pr-pic .ics{width:68%;height:68%}
.pr-amt{font:800 48px/1 "Bricolage Grotesque",sans-serif;letter-spacing:-.04em;margin:18px 0 0;font-variant-numeric:tabular-nums;display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.pr-amt small{font:500 15px Figtree,sans-serif;color:var(--mute);letter-spacing:0}
.pr-amt.q{font-size:30px}
/* Precios muy largos: la letra se achica lo justo para que el precio quepa entero en su tarjeta (--w = ancho del precio en "em", lo pone plan()).
   Los precios normales siguen en 48px. En navegadores sin unidades cqw, los de 7 cifras o más usan la letra chica de .pr-amtl. */
.pr-amt.pr-amtl{font-size:clamp(26px,8.6vw,36px)}
@supports (width:1cqw){.pr-plan{container-type:inline-size}.pr-amt[style]{font-size:min(48px,calc(100cqw/var(--w,1)))}}
.pr-plan ul{list-style:none;padding:0;margin:20px 0 26px;display:grid;gap:10px;color:var(--mute);font-size:15.5px}
.pr-plan li{display:flex;gap:10px}
.pr-plan li svg{width:18px;height:18px;color:var(--hi);flex:none;margin-top:3px}
.pr-plan .pr-btn{margin-top:auto;width:100%}
.pr-fine{text-align:center;color:var(--mute);font-size:15px;margin-top:20px}
.pr-fine b{color:var(--ink)}
/* cómo reservar */
.pr-flow{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;margin:34px auto 0;max-width:640px;position:relative}
.pr-flow::before{content:"";position:absolute;left:10%;right:10%;top:27px;height:1px;background:var(--line)}
.pr-flow div{position:relative;text-align:center;font-size:13px;font-weight:600;color:var(--ink)}
.pr-flow span{display:grid;place-items:center;width:54px;height:54px;margin:0 auto 8px;border-radius:50%;background:var(--bg);box-shadow:inset 0 0 0 1.5px var(--hi);color:var(--hi)}
.pr-flow svg{width:24px;height:24px}
.pr-cc2{display:flex;flex-wrap:wrap;justify-content:center;gap:12px;margin-top:30px}
.pr-steps{display:grid;gap:26px;margin:44px 0 0;list-style:none;padding:0}
@media(min-width:800px){.pr-steps{grid-template-columns:repeat(3,1fr)}}
.pr-steps li{text-align:center}
.pr-steps .n{display:grid;place-items:center;width:58px;height:58px;margin:0 auto 16px;border-radius:50%;background:var(--cta);color:var(--ctaink);font:800 22px "Bricolage Grotesque",sans-serif;box-shadow:0 0 0 6px color-mix(in srgb,var(--hi) 16%,transparent)}
.pr-steps p{color:var(--mute);margin:8px auto 0;font-size:16px;max-width:30ch}
/* por qué elegirnos */
.pr-why{display:grid;gap:12px;margin-top:40px}
@media(min-width:800px){.pr-why{grid-template-columns:repeat(3,1fr)}}
.pr-wy{border-radius:24px;padding:24px;background:var(--cardt);box-shadow:inset 0 0 0 1px var(--hair),var(--sh)}
.pr-wi{display:grid;place-items:center;width:46px;height:46px;border-radius:14px;margin-bottom:14px;background:color-mix(in srgb,var(--hi) 12%,transparent);color:var(--hi)}
.pr-wi svg{width:24px;height:24px}
.pr-wy p{color:var(--mute);margin-top:8px;font-size:15.5px}
/* zonas y horario */
.pr-zones{display:flex;flex-wrap:wrap;justify-content:center;gap:10px;margin-top:34px}
.pr-zc{display:inline-flex;align-items:center;gap:10px;padding:11px 16px;border-radius:14px;background:var(--cardt);box-shadow:inset 0 0 0 1px var(--hair);font-size:15px}
.pr-zc i{font-style:normal;font-weight:800;color:var(--hi)}
.pr-zc.free i{color:var(--wa)}html[data-pm=light] .pr-zc.free i{color:#1a9e4d}
.pr-zc small{color:var(--mute)}
.pr-hours{display:flex;flex-wrap:wrap;justify-content:center;gap:10px;margin-top:22px}
.pr-hours span{padding:10px 16px;border-radius:12px;background:var(--cardt);box-shadow:inset 0 0 0 1px var(--hair);font-weight:600;font-size:15px}
/* reseñas */
.pr-revs{display:grid;gap:14px;margin-top:40px}
@media(min-width:800px){.pr-revs{grid-template-columns:repeat(2,1fr)}}
.pr-rv{margin:0;border-radius:24px;padding:26px;background:var(--cardt);box-shadow:inset 0 0 0 1px var(--hair),var(--sh)}
.pr-stars{display:flex;gap:2px;color:#f5b52e;margin-bottom:14px}
.pr-stars svg{width:18px;height:18px}
.pr-rv blockquote{margin:0;font:700 22px/1.3 "Bricolage Grotesque",sans-serif;letter-spacing:-.015em;overflow-wrap:anywhere}
.pr-rv figcaption{display:flex;align-items:center;gap:12px;margin-top:18px;color:var(--mute);font-size:14px}
.pr-rv figcaption b{display:block;color:var(--ink);font-size:15px}
.pr-avt{width:40px;height:40px;flex:none;border-radius:50%;display:grid;place-items:center;background:color-mix(in srgb,var(--hi) 16%,transparent);color:var(--hi);font-weight:700}
/* preguntas */
.pr-faq{max-width:760px;margin:40px auto 0;display:grid;gap:10px}
.pr details{border:0;margin:0;border-radius:18px;background:var(--cardt);box-shadow:inset 0 0 0 1px var(--hair),var(--sh)}
.pr summary{cursor:pointer;list-style:none;padding:20px 60px 20px 22px;font-weight:700;font-size:17px;position:relative}
.pr summary::-webkit-details-marker{display:none}
.pr summary::after{content:"";position:absolute;right:20px;top:50%;width:26px;height:26px;margin-top:-13px;border-radius:50%;box-shadow:inset 0 0 0 1.5px var(--line);background:linear-gradient(var(--ink),var(--ink)) center/11px 2px no-repeat,linear-gradient(var(--ink),var(--ink)) center/2px 11px no-repeat;transition:transform 240ms var(--ease);transform:none}
.pr details[open] summary::after{transform:rotate(45deg)}
.pr details p{color:var(--mute);padding:0 22px 20px;white-space:pre-line}
/* cierre */
.pr-final{text-align:center;padding-bottom:100px}
.pr-badge{width:92px;height:92px;margin:0 auto 26px;border-radius:28px;display:grid;place-items:center;overflow:hidden;background:linear-gradient(160deg,color-mix(in srgb,var(--hi) 26%,transparent),var(--card));box-shadow:inset 0 0 0 1.5px var(--hi),0 20px 50px -20px rgba(0,0,0,.6);font:800 40px "Bricolage Grotesque",sans-serif}
.pr-badge img{width:100%;height:100%;object-fit:cover}
.pr-mini{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;max-width:560px;margin:44px auto 0;list-style:none;padding:0}
.pr-mini li{font-size:14px;font-weight:600;color:var(--mute)}
.pr-mini span{display:grid;place-items:center;width:40px;height:40px;margin:0 auto 10px;border-radius:50%;background:var(--cta);color:var(--ctaink);font:800 16px "Bricolage Grotesque",sans-serif}
/* pie */
.pr .pr-ft{padding:44px 0 36px;border-top:1px solid var(--hair);color:var(--mute);font-size:14.5px;text-align:left;margin:0}
.pr-ft a{text-decoration:none}
.pr-foot{display:grid;gap:28px;grid-template-columns:minmax(0,1fr)}.pr-foot>*{min-width:0}
@media(min-width:800px){.pr-foot{grid-template-columns:1.4fr 1fr 1fr}}
.pr-foot p{margin-top:12px;max-width:38ch}
.pr-foot .pr-logo{color:var(--ink)}
.pr-foot nav a,.pr-fl{display:block;line-height:2}
.pr-foot h4{margin:0 0 8px;color:var(--ink);font-size:14px}
.pr-soc{display:flex;flex-wrap:wrap;gap:8px 16px}
@media (hover:hover) and (pointer:fine){.pr-ft a:hover{color:var(--ink)}}
.pr-base{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px;margin-top:30px;padding-top:20px;border-top:1px solid var(--hair);font-size:13.5px}
.pr-mode{background:none;border:0;color:var(--mute);font:inherit;cursor:pointer;padding:6px 0;text-decoration:underline;text-underline-offset:.22em}
/* barra fija inferior */
.pr-dock{position:fixed;left:0;right:0;bottom:0;z-index:30;display:flex;gap:10px;padding:10px 12px calc(10px + env(safe-area-inset-bottom,0px));background:linear-gradient(180deg,transparent,color-mix(in srgb,var(--bg) 94%,transparent) 30%)}
.pr-dock .pr-btn{flex:1;min-height:54px}
.pr-dock .pr-wab{flex:0 0 54px;padding:0}
.pr-dock .pr-wab svg{width:28px;height:28px}
@media(min-width:900px){.pr-dock{display:none}}
@media(max-width:380px){.pr-flow{font-size:12px}.pr-flow span{width:46px;height:46px}.pr-flow::before{top:23px}}
/* ===== Plantilla CLARA: fondo claro cálido, tarjetas blancas y el color del negocio como acento ===== */
html[data-th=clara]{--bg:#f7f5f0;--card:#fff;--ink:#14171c;--mute:#5b6370;--dim:#7a8290;--line:#e6e1d6;--hair:#ebe6da;--dark:#14171c;--darkln:rgba(255,255,255,.1);--wa:#16a34a;--sh:0 1px 2px rgba(20,23,28,.04),0 10px 28px -18px rgba(20,23,28,.22);--ease:cubic-bezier(.2,.8,.2,1);color-scheme:light;scroll-padding-top:82px}
html[data-th=clara][data-pm=dark]{--bg:#0e1013;--card:#171a1f;--ink:#eef0f3;--mute:#a3abb7;--dim:#8a93a0;--line:#2a2e36;--hair:#23272e;--dark:#1b1f26;--darkln:rgba(255,255,255,.08);--wa:#25d366;--sh:0 1px 2px rgba(0,0,0,.3),0 10px 28px -18px rgba(0,0,0,.7);color-scheme:dark}
html[data-th=clara] body{background:var(--bg);color:var(--ink)}
#page.cl{position:relative;font:16.5px/1.55 Figtree,system-ui,-apple-system,sans-serif;color:var(--ink);padding-bottom:calc(92px + env(safe-area-inset-bottom,0px));overflow-x:clip}
@media(min-width:900px){#page.cl{padding-bottom:0}}
.cl *{box-sizing:border-box}
:where(#page.cl) a{color:inherit}
.cl h1,.cl h2,.cl h3{font-family:"Bricolage Grotesque",system-ui,sans-serif;margin:0;text-wrap:balance}
.cl p{margin:0}
.cl img,.cl svg{display:block;max-width:100%}
.cl :focus-visible{outline:2.5px solid var(--acct);outline-offset:3px;border-radius:10px}
.cl-w{max-width:1160px;margin:0 auto;padding:0 20px;position:relative}
@media(min-width:900px){.cl-w{padding:0 36px}}
.cl-k{display:block;font:800 12.5px/1.2 Figtree,sans-serif;letter-spacing:.14em;text-transform:uppercase;color:var(--acct);margin-bottom:10px}
.cl h2{font-size:clamp(29px,7.6vw,46px);font-weight:800;line-height:1.05;letter-spacing:-.035em;overflow-wrap:break-word}
