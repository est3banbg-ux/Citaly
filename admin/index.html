<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Citaly · Panel del admin</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#1a1530">
<link rel="icon" href="../favicon-32.png">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;700;800&family=Figtree:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../style.css">
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="../cfg.js"></script>
<style>
.wrap{max-width:720px}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:14px 0}
@media(min-width:620px){.kpis{grid-template-columns:repeat(3,1fr)}}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:13px;box-shadow:var(--sh)}
.kpi span{font-size:12px;color:var(--mute);font-weight:600}.kpi b{display:block;font:800 22px "Bricolage Grotesque",sans-serif}
.kpi.big{grid-column:1/-1;background:linear-gradient(135deg,#6c4cf5,#4b2fd6);color:#fff;border:0}.kpi.big span{color:rgba(255,255,255,.8)}.kpi.big b{font-size:32px}
.biz{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:10px;box-shadow:var(--sh)}
.biz .hd{display:flex;gap:10px;align-items:center}
.av{width:44px;height:44px;border-radius:12px;background:var(--soft);display:grid;place-items:center;font-weight:800;overflow:hidden;flex:none}
.av img{width:100%;height:100%;object-fit:cover}
.biz .m{flex:1;min-width:0}.biz .m b{display:block}.biz .m span{font-size:13px;color:var(--mute);display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.biz .ac{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.li{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--line);font-size:14px;gap:10px}.li:last-child{border-bottom:0}
/* editor */
.ed h2{margin:0 0 4px}.ed .card{margin-bottom:14px}
.ed .hint{font-size:13px;color:var(--mute);margin:2px 0 0}
.slugbox{display:flex;align-items:center;border:1.5px solid var(--line);border-radius:12px;background:var(--bg);overflow:hidden}
.slugbox b{padding:0 2px 0 12px;color:var(--mute);font-weight:600;font-size:14px;white-space:nowrap}
.slugbox input{border:0;background:transparent;padding-left:0}
.swatches{display:flex;gap:9px;flex-wrap:wrap;align-items:center}
.swatches button{width:36px;height:36px;border-radius:50%;border:3px solid transparent;cursor:pointer;box-shadow:0 0 0 1px var(--line)}
.swatches button[aria-pressed=true]{border-color:var(--card);box-shadow:0 0 0 3px var(--ink)}
.swatches input{width:52px;height:38px;padding:2px;border-radius:10px}
.logoup{display:flex;align-items:center;gap:12px}
.logoup .lg{width:72px;height:72px;border-radius:18px;background:var(--soft);display:grid;place-items:center;font-size:26px;overflow:hidden;flex:none}
.logoup .lg img{width:100%;height:100%;object-fit:cover}
.rowl{display:grid;gap:7px;padding:10px 0;border-bottom:1px solid var(--line)}.rowl:last-child{border-bottom:0}
.r4{display:grid;grid-template-columns:52px 1fr 36px;gap:7px;align-items:center}
.r3{display:grid;grid-template-columns:1fr 1fr;gap:7px}
.rowl input,.rowl select,.rowl textarea{padding:9px 10px}
.ib{width:36px;height:36px;border-radius:10px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);font-size:16px;cursor:pointer;display:inline-grid;place-items:center;flex:none}
.hrow{display:grid;grid-template-columns:62px 1fr 1fr;gap:8px;align-items:center;margin-bottom:8px}
.hrow input{padding:8px 10px}.hrow input:disabled{opacity:.35}
.toggle{position:relative;width:50px;height:30px;flex:none}
.toggle input{opacity:0;width:0;height:0}
.toggle span{position:absolute;inset:0;background:var(--line);border-radius:99px;transition:.2s;cursor:pointer}
.toggle span:before{content:"";position:absolute;width:24px;height:24px;left:3px;top:3px;background:#fff;border-radius:50%;transition:.2s;box-shadow:0 1px 3px rgba(0,0,0,.3)}
.toggle input:checked+span{background:var(--acc)}.toggle input:checked+span:before{transform:translateX(20px)}
.photos{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.ph{position:relative;border-radius:12px;overflow:hidden;background:var(--soft);display:flex;flex-direction:column}
.ph img{width:100%;aspect-ratio:1;object-fit:cover;display:block}
.ph input{border-radius:0;border:0;border-top:1px solid var(--line);padding:7px 8px;font-size:13px;background:var(--card)}
.ph .tb{position:absolute;top:5px;right:5px;display:flex;gap:4px}
.ph .tb button{width:28px;height:28px;border-radius:8px;border:0;background:rgba(0,0,0,.6);color:#fff;cursor:pointer;font-size:13px}
.ph .n{position:absolute;top:5px;left:5px;background:rgba(0,0,0,.6);color:#fff;border-radius:8px;padding:2px 7px;font-size:12px;font-weight:700}
.savebar{position:sticky;bottom:0;z-index:20;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);padding:10px 0 calc(10px + env(safe-area-inset-bottom,0px));display:flex;gap:8px}
.demo{display:flex;gap:10px;align-items:center;background:color-mix(in srgb,var(--acc2) 14%,var(--card));border:1px dashed color-mix(in srgb,var(--acc2) 50%,var(--line));border-radius:14px;padding:11px 13px;margin-bottom:14px;font-size:14px}
.demo .btn{flex:none}
</style>
</head>
<body>
<div class="wrap">
  <div class="between" style="margin:6px 0 4px"><a class="logo" href="../"><img src="../icon-192.png" alt="">citaly <span class="pill">admin</span></a><button class="btn sm ghost" id="out" hidden>Salir</button></div>

  <div id="login" class="card" hidden style="margin-top:20px">
    <h2>Panel del admin</h2><p class="mute">Entra con la cuenta de Google de administrador.</p>
    <button class="btn" id="gIn">Entrar con Google</button><p class="err" id="lErr"></p>
  </div>

  <div id="main" hidden>
    <div class="kpis" id="kpis"></div>
    <button class="btn" id="newB">+ Nuevo negocio</button>
    <div style="height:12px"></div>
    <input id="q" type="search" placeholder="Buscar negocio, correo o link">
    <div class="chips" id="f" style="margin:10px 0 12px">
      <button class="chip" data-f="all" aria-pressed="true">Todos</button><button class="chip" data-f="active" aria-pressed="false">Activos</button><button class="chip" data-f="owe" aria-pressed="false">Con saldo</button><button class="chip" data-f="suspended" aria-pressed="false">Pausados</button><button class="chip" data-f="demo" aria-pressed="false">Demos</button>
    </div>
    <div id="list"></div>
    <div class="card"><h2>Pagos recibidos</h2><div id="pays"></div></div>
  </div>

  <div id="ed" class="ed" hidden></div>
  <div id="load"><div class="spin"></div></div>
</div>
<div class="toast" id="toast"></div>
<script>
"use strict";
var $=function(i){return document.getElementById(i)},C=CITALY,MN=["ene","feb","mar","abr","may","jun","jul","ago","sep","oct","nov","dic"];
var DS=["Dom","Lun","Mar","Mié","Jue","Vie","Sáb"],DURS=[15,30,45,60,75,90,105,120,150,180,240,300,360,480];
var RESERVED=["app","admin","r","w","demo","www","api","citaly","ayuda","precios","login","privacidad","terminos"];
var SUBS={},BIZ={},PAYS=[],F="all";
function crc(n){return "₡"+Math.round(n||0).toLocaleString("es-CR")}
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
function fd(ms){var d=new Date(ms);return d.getDate()+" "+MN[d.getMonth()]+" "+d.getFullYear()}
function pad(n){return n<10?"0"+n:""+n}
function ymd(d){return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate())}
function tm(s){var p=String(s||"0:0").split(":");return +p[0]*60+ +p[1]}
function durTxt(m){var h=Math.floor(m/60),r=m%60;return ((h?h+" h":"")+(h&&r?" ":"")+(r?r+" min":""))||"0 min"}
function toast(t){var e=$("toast");e.textContent=t;e.classList.add("on");clearTimeout(toast.t);toast.t=setTimeout(function(){e.classList.remove("on")},2600)}
function telN(v){var n=String(v||"").replace(/\D/g,"");if(n.length===11&&n.indexOf("506")===0)n=n.slice(3);return n}
function waUrl(t,m){t=telN(t);return "https://wa.me/"+(t.length===8?"506"+t:t)+(m?"?text="+encodeURIComponent(m):"")}
function slugify(s){return String(s||"").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/[^a-z0-9]+/g,"-").replace(/^-+|-+$/g,"").slice(0,40)}
function emails(t){return String(t||"").toLowerCase().split(/[\s,;]+/).map(function(x){return x.trim()}).filter(function(x){return /^\S+@\S+\.\S+$/.test(x)})}
function lines(t){return String(t||"").split(/\n/).map(function(x){return x.trim()}).filter(Boolean)}
firebase.initializeApp(C.fb);var auth=firebase.auth(),db=firebase.firestore(),TS=firebase.firestore.Timestamp;

auth.onAuthStateChanged(function(u){$("load").hidden=true;$("out").hidden=!u;
  if(!u){$("login").hidden=false;$("main").hidden=true;$("ed").hidden=true;return}
  if(u.email!==C.admin){$("login").hidden=false;$("lErr").textContent="Esta cuenta ("+u.email+") no es la de administrador.";return}
  $("login").hidden=true;$("main").hidden=false;listen()});
$("gIn").onclick=function(){auth.signInWithPopup(new firebase.auth.GoogleAuthProvider()).catch(function(e){if(e.code!=="auth/popup-closed-by-user")$("lErr").textContent=e.message})};
$("out").onclick=function(){auth.signOut()};
var listening=false;
function listen(){if(listening)return;listening=true;
  db.collection("subs").onSnapshot(function(s){SUBS={};s.forEach(function(d){SUBS[d.id]=d.data()});render()},err);
  db.collection("biz").onSnapshot(function(s){BIZ={};s.forEach(function(d){BIZ[d.id]=d.data()});render()},err);
  db.collection("payments").orderBy("at","desc").limit(200).onSnapshot(function(s){PAYS=s.docs.map(function(d){return d.data()});renderPays()},err)}
function err(e){console.error(e);toast(e.code==="permission-denied"?"Sin permiso: revisa las reglas de Firestore":"Error de conexión")}

/* ---------- LISTA ---------- */
function state(s){if(!s)return "none";if(s.demo)return "demo";if(s.status==="suspended")return "suspended";return "active"}
var PLANS={promo:{n:"Promo de lanzamiento",p:C.setup.promo},standard:{n:"Standard",p:C.setup.std},pers:{n:"Personalizado",p:C.setup.pers}};
var FAR=function(){return TS.fromMillis(Date.now()+100*365*864e5)};
function paidOf(id){return PAYS.filter(function(p){return p.biz===id}).reduce(function(a,p){return a+(+p.amt||0)},0)}
function totalOf(s){return s&&!s.demo?(s.total!=null?+s.total:(PLANS[s.plan]||PLANS.standard).p):0}
function render(){var ids=Object.keys(BIZ),now=Date.now(),c={active:0,suspended:0,demo:0,none:0},owe=0,promo=0;
  ids.forEach(function(i){var s=SUBS[i],st=state(s);if(c[st]!=null)c[st]++;if(st!=="demo"&&st!=="none"){owe+=Math.max(0,totalOf(s)-paidOf(i));if(s.plan==="promo")promo++}});
  var mStart=new Date();mStart.setDate(1);mStart.setHours(0,0,0,0);
  var all=PAYS.reduce(function(a,p){return a+(+p.amt||0)},0),mon=PAYS.filter(function(p){return p.at>=mStart.getTime()}).reduce(function(a,p){return a+(+p.amt||0)},0);
  $("kpis").innerHTML='<div class="kpi big"><span>Cobrado en total</span><b>'+crc(all)+'</b></div>'
    +k("Cobrado este mes",crc(mon))+k("Saldo por cobrar",crc(owe))+k("Negocios activos",c.active)+k("Cupos de promo usados",promo+" de "+(C.promoCupos||5))+k("Demos",c.demo);
  var q=$("q").value.trim().toLowerCase();
  var L=ids.map(function(i){return {id:i,s:SUBS[i]||null,b:BIZ[i]}}).filter(function(x){var st=state(x.s);if(F==="owe"){if(st==="demo"||Math.max(0,totalOf(x.s)-paidOf(x.id))<=0)return false}else if(F!=="all"&&st!==F)return false;
      return !q||[x.b.name,x.b.email,x.b.slug,x.b.wa,(x.b.team||[]).join(" ")].join(" ").toLowerCase().indexOf(q)>=0})
    .sort(function(a,b){return (b.b.created&&b.b.created.toMillis?b.b.created.toMillis():0)-(a.b.created&&a.b.created.toMillis?a.b.created.toMillis():0)});
  $("list").innerHTML=L.length?L.map(function(x){var st=state(x.s),b=x.b,s=x.s,tot=totalOf(s),paid=paidOf(x.id),due=Math.max(0,tot-paid);
      var p=st==="demo"?'<span class="pill warn">Demo</span>':st==="suspended"?'<span class="pill bad">Pausado</span>':st==="none"?'<span class="pill bad">Sin plan</span>':due>0?'<span class="pill warn">Saldo '+crc(due)+'</span>':'<span class="pill ok">Pagado</span>';
      var plan=s&&!s.demo&&PLANS[s.plan]?PLANS[s.plan].n:"",mods=b.mods?Object.keys(b.mods).filter(function(k){return b.mods[k]&&C.mods[k]}).map(function(k){return C.mods[k].ic}).join(""):"";
      return '<div class="biz"><div class="hd"><div class="av">'+(b.logo?'<img alt="" src="'+b.logo+'">':esc((b.name||"?").charAt(0)))+'</div><div class="m"><b>'+esc(b.name||"(sin nombre)")+'</b><span>'+esc(b.email||"")+((b.team||[]).length?" + "+b.team.length+" del equipo":"")+'</span><span>'+(b.slug?'citalyapp.com/'+esc(b.slug):"")+(plan?" · "+plan:"")+(mods?" · "+mods:"")+'</span></div>'+p+'</div>'
        +(st!=="demo"&&st!=="none"?'<p class="small mute" style="margin:8px 0 0">Pagó '+crc(paid)+' de '+crc(tot)+(due?' · <b style="color:var(--bad)">debe '+crc(due)+'</b>':' · ✓ completo')+'</p>':"")
        +'<div class="ac"><button class="btn sm" data-a="edit" data-id="'+x.id+'">✏️ Editar</button>'
        +(b.slug?'<a class="btn sm alt" target="_blank" href="../'+esc(b.slug)+'">🌐 Web</a><a class="btn sm alt" target="_blank" href="../r/?n='+esc(b.slug)+'">📅 Reservas</a>':"")
        +(st!=="demo"?'<button class="btn sm ghost" data-a="pay" data-id="'+x.id+'">💸 Registrar pago</button>':"")
        +(b.wa?'<a class="btn sm wa" target="_blank" rel="noopener" href="'+waUrl(b.wa,"¡Hola! Te escribe Esteban de Citaly 👋")+'">WhatsApp</a>':"")
        +(s?(st==="suspended"?'<button class="btn sm ghost" data-a="on" data-id="'+x.id+'">Reactivar</button>':'<button class="btn sm danger" data-a="off" data-id="'+x.id+'">Pausar</button>'):"")+'</div></div>'}).join("")
    :'<div class="card mute" style="text-align:center">'+(ids.length?"Nada con ese filtro.":"Todavía no hay negocios. Toca <b>+ Nuevo negocio</b>.")+'</div>'}
function k(l,v){return '<div class="kpi"><span>'+l+'</span><b>'+v+'</b></div>'}
function renderPays(){$("pays").innerHTML=PAYS.length?PAYS.map(function(p){return '<div class="li"><span>'+esc(p.name||"")+' <span class="pill">'+(p.type==="setup"?"Instalación":p.type==="saldo"?"Saldo":p.type==="mes"?"Mensualidad":esc(p.what||"Extra"))+'</span><br><span class="mute small">'+fd(p.at)+'</span></span><b>'+crc(p.amt)+'</b></div>'}).join(""):'<p class="mute small" style="margin:0">Aún no hay pagos registrados.</p>';render()}
$("q").oninput=render;
$("f").onclick=function(e){var b=e.target.closest("button");if(!b)return;F=b.dataset.f;Array.prototype.forEach.call(this.children,function(x){x.setAttribute("aria-pressed",x===b)});render()};
$("list").onclick=function(e){var b=e.target.closest("[data-a]");if(!b)return;var id=b.dataset.id,s=SUBS[id],bz=BIZ[id]||{},a=b.dataset.a,ref=db.doc("subs/"+id);
  if(a==="edit"){openEd(id);return}
  if(a==="pay"){var due=Math.max(0,totalOf(s)-paidOf(id)),amt=prompt(due?"¿Cuánto pagó "+(bz.name||"")+"? Debe "+crc(due)+" de la instalación.":"¿Cuánto pagó "+(bz.name||"")+"? (por ejemplo, un módulo o un cambio a la medida)",due||C.modFrom);if(amt==null)return;amt=+String(amt).replace(/\D/g,"")||0;if(!amt)return;
    var what=due?"saldo":(prompt("¿Qué pagó? (ej: módulo de insumos, cambio de diseño)","Módulo")||"Extra").slice(0,60),bt=db.batch();
    if(!due&&s)bt.set(ref,{total:totalOf(s)+amt},{merge:true});
    bt.set(db.collection("payments").doc(),{biz:id,name:bz.name||"",amt:amt,at:Date.now(),type:due?"saldo":"extra",what:due?"Saldo de la instalación":what});
    bt.commit().then(function(){toast("Pago registrado ✓");if(bz.wa&&confirm("¿Avisarle por WhatsApp que recibiste el pago?"))window.open(waUrl(bz.wa,"¡Hola! Recibimos tu pago de "+crc(amt)+" ✅ ¡Muchas gracias! 🙌 — Citaly"),"_blank")},function(x){toast(x.message)})}
  if(a==="off"&&confirm("¿Pausar a "+(bz.name||"este negocio")+"? Su página dejará de recibir reservas."))ref.update({status:"suspended"}).then(function(){toast("Pausado")});
  if(a==="on")ref.update({status:"active"}).then(function(){toast("Reactivado")})};

/* ---------- EDITOR DE NEGOCIO ---------- */
var E=null;
function blank(){var t=C.types.otro;return {id:null,name:"",type:"",slug:"",slugOk:false,wa:"",addr:"",email:"",team:"",color:C.colors[0],logo:"",
  services:[],hours:[0,1,2,3,4,5,6].map(function(d){return {on:d>=1&&d<=6,a:"08:00",b:"18:00"}}),home:false,zones:[],
  tagline:"",blurb:"",promo:"",web:{faqs:[],reviews:[]},fotos:[],delFotos:[],
  plan:"promo",total:C.setup.promo,paidNow:C.setup.promo/2,demo:false,mods:{},veh:[{n:"Sedán o hatchback",x:0},{n:"SUV o pick-up",x:5000}],extra:{}}}
function openEd(id){
  if(!id){E=blank();edRender();return}
  var b=BIZ[id],s=SUBS[id]||{};if(!b)return;$("load").hidden=false;
  db.collection("pub/"+b.slug+"/fotos").orderBy("i").get().then(function(q){return q.docs.map(function(d){var x=d.data();return {id:d.id,img:x.img,cap:x.cap||""}})},function(){return []}).then(function(fotos){$("load").hidden=true;
    E={id:id,name:b.name||"",type:b.type||"otro",slug:b.slug,slugOk:true,wa:b.wa||"",addr:b.addr||"",email:b.email||"",team:(b.team||[]).join("\n"),color:b.color||C.colors[0],logo:b.logo||"",
      services:(b.services||[]).map(function(x){return Object.assign({},x)}),hours:(b.hours||blank().hours).map(function(h){return Object.assign({},h)}),home:!!b.home,zones:(b.zones||[]).map(function(z){return Object.assign({},z)}),
      tagline:b.tagline||"",blurb:b.blurb||"",promo:b.promo||"",web:JSON.parse(JSON.stringify(b.web||{})),fotos:fotos,delFotos:[],
      plan:PLANS[s.plan]?s.plan:"standard",total:totalOf(s)||(PLANS[s.plan]||PLANS.standard).p,paidNow:0,demo:!!s.demo,mods:Object.assign({},b.mods||{}),veh:(b.veh&&b.veh.length?b.veh:blank().veh).map(function(v){return Object.assign({},v)}),
      oldEmails:[b.email].concat(b.team||[]).filter(Boolean).map(function(x){return x.toLowerCase()}),
      extra:{open:b.open,ahead:b.ahead,lead:b.lead,showPrices:b.showPrices,askHow:b.askHow,goal:b.goal}};
    E.web.faqs=E.web.faqs||[];E.web.reviews=E.web.reviews||[];edRender()})}
function closeEd(){E=null;$("ed").hidden=true;$("main").hidden=false;window.scrollTo(0,0)}
function sec(t,sub){return '<h2>'+t+'</h2>'+(sub?'<p class="hint" style="margin-bottom:6px">'+sub+'</p>':"")}
function tog(id,on){return '<label class="toggle"><input type="checkbox" id="'+id+'"'+(on?" checked":"")+'><span></span></label>'}
function edRender(){var nw=!E.id,W=E.web;$("main").hidden=true;$("ed").hidden=false;
  var h='<div class="between" style="margin:10px 0 12px"><h1>'+(nw?"Nuevo negocio":esc(E.name))+'</h1><button class="btn sm ghost" id="eX">Cerrar</button></div>';
  if(nw)h+='<div class="demo"><span style="flex:1">¿Armando la demo? Llena todo con los datos, logo y fotos de GlassStudioCR.</span><button class="btn sm" id="eDemo">Usar GlassStudioCR</button></div>';
  // datos
  h+='<div class="card">'+sec("1. Datos del negocio")
    +'<label for="eN">Nombre</label><input id="eN" maxlength="50" value="'+esc(E.name)+'" placeholder="Ej: Barbería El Legado">'
    +'<label for="eT">Tipo de negocio</label><select id="eT"><option value="">Elige…</option>'+Object.keys(C.types).map(function(k){return '<option value="'+k+'"'+(E.type===k?" selected":"")+'>'+C.types[k].ic+" "+esc(C.types[k].n)+'</option>'}).join("")+'</select>'

function checkSlug(){var s=E.slug,m=$("eSm");E.slugOk=false;if(!m)return Promise.resolve(true);
  if(!/^[a-z0-9][a-z0-9-]{1,38}[a-z0-9]$/.test(s)){m.textContent="Usa entre 3 y 40 letras, números o guiones.";m.style.color="var(--bad)";return Promise.resolve(false)}
  if(RESERVED.indexOf(s)>=0){m.textContent="Ese nombre está reservado. Prueba otro.";m.style.color="var(--bad)";return Promise.resolve(false)}
  return db.doc("pub/"+s).get().then(function(d){if(E.slug!==s)return false;if(d.exists){m.textContent="✗ Ya lo usa otro negocio.";m.style.color="var(--bad)";return false}
    E.slugOk=true;m.textContent="✓ Disponible: citalyapp.com/"+s;m.style.color="var(--ok)";return true},function(){m.textContent="No se pudo revisar. Revisa tu internet.";m.style.color="var(--bad)";return false})}

/* imágenes: logo cuadrado y fotos con el lado más largo a S px */
function readImg(f){return new Promise(function(ok,ko){var r=new FileReader();r.onload=function(){var im=new Image();im.onload=function(){ok(im)};im.onerror=ko;im.src=r.result};r.onerror=ko;r.readAsDataURL(f)})}
function enc(c,q){var u=c.toDataURL("image/webp",q);if(u.indexOf("image/webp")<0)u=c.toDataURL("image/jpeg",q);return u}
function squareImgEl(im,S){var c=document.createElement("canvas"),s=Math.min(im.width,im.height);c.width=c.height=S;var x=c.getContext("2d");x.fillStyle="#fff";x.fillRect(0,0,S,S);x.drawImage(im,(im.width-s)/2,(im.height-s)/2,s,s,0,0,S,S);return enc(c,.85)}
function fitImgEl(im,S){var k=Math.min(1,S/Math.max(im.width,im.height)),c=document.createElement("canvas");c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);var x=c.getContext("2d");x.fillStyle="#fff";x.fillRect(0,0,c.width,c.height);x.drawImage(im,0,0,c.width,c.height);
  var q=.82,u=enc(c,q);while(u.length>600000&&q>.4){q-=.12;u=enc(c,q)}return u}
function squareImg(f,S){return readImg(f).then(function(im){return squareImgEl(im,S)})}
function fitImg(f,S){return readImg(f).then(function(im){return fitImgEl(im,S)})}
function urlImg(u){return new Promise(function(ok,ko){var im=new Image();im.onload=function(){ok(im)};im.onerror=ko;im.src=u})}
