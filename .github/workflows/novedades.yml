# Actualiza app/novedades-auto.js con las líneas "Novedad: emoji | Título | Texto" de los commits.
name: Novedades automáticas
on:
  push:
    branches: [main]
    paths-ignore:
      - 'app/novedades-auto.js'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: novedades-main
  cancel-in-progress: false
jobs:
  generar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Generar novedades desde los commits
        run: python3 tools/gen_novedades.py --ref main
      - name: Commit y push si cambió
        run: |
          if git diff --quiet -- app/novedades-auto.js && [ -z "$(git ls-files --others --exclude-standard -- app/novedades-auto.js)" ]; then
            echo "Sin cambios en novedades."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/novedades-auto.js
          git commit -m "Novedades: actualización automática [skip ci]"
          for i in 1 2 3; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            sleep 5
          done
          exit 1
