# Cada 3 horas (y a mano) crea/actualiza la página de cada negocio para Google, el sitemap y la vista previa
# del link (título, descripción e imagen que salen al compartirlo por WhatsApp, Facebook o TikTok).
name: SEO de negocios
on:
  schedule:
    - cron: "17 */3 * * *"
  workflow_dispatch:
concurrency: seo
permissions:
  contents: write
jobs:
  gen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -q "pillow>=11,<13"
      - run: node tools/gen-seo.mjs
      - run: python3 tools/gen-og.py
      - name: Subir cambios
        run: |
          git config user.name "citaly-bot"; git config user.email "bot@citalyapp.com"
          git add -A
          git diff --cached --quiet || (git commit -m "SEO: páginas de negocios y sitemap" && git pull --rebase -q && git push)
